name: Update official bank vacancies

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-bank-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official vacancy structured data
        run: python fetch_jobs.py

      - name: Commit updated vacancy feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          git diff --cached --quiet || git commit -m 'Update official bank vacancies'
          git pull --rebase origin main
          git push
